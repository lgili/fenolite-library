schema = "fenolite.library.v0"
name = "fenolite-library"
version = "1.0.0"

[requires]
fenolite = ">=0.7.0.dev0"

[tools]
# Core commit e7673c81 on top of the public head 468d8a61 of lgili/Fenolite `cac/dev-rewrite`, which carries
# the c0262/c0266/c0270/c0273/c0279 commands the jobs require, plus c0266 tasks 6.1 (review sheets independent
# of the Python version, fef4ea08) and 6.2 (device review digest). It must be pushed unchanged (or this pin
# renewed) and its CI be green before this library's pull request merges; `licences.toml` equals its
# `cli/data/library-licences.toml` byte for byte.
fenolite = "e7673c811d5ca25d269c2d9c0f30e686f5148844"
uv = "0.12.23"
kicad_cli = "10.0.6"
# Official immutable 10.0.6 index + linux/amd64 manifest/config verified against registry bytes.
# Required for derived padvia proofs; historical 9.0.2 pin is recorded in docs/kicad10-ci-pin-review.json.
# Actual container CLI/version remains a required CI gate; metadata is not an execution proof.
kicad_image = "docker.io/kicad/kicad@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec"
