schema = "fenolite.library.v0"
name = "fenolite-library"
version = "0.1.0"

[requires]
fenolite = ">=0.7.0.dev0"

[tools]
# Public immutable baseline. Update only after the feature integration is public and validated.
# This baseline lacks c0262/c0270/c0273/c0266 commands; their CI guards deliberately fail.
fenolite = "b8b24842c1b792a0fcb37a6a7e5ca0270b90efd6"
uv = "0.12.23"
kicad_cli = "10.0.6"
# Official immutable 10.0.6 index + linux/amd64 manifest/config verified against registry bytes.
# Required for derived padvia proofs; historical 9.0.2 pin is recorded in docs/kicad10-ci-pin-review.json.
# Actual container CLI/version remains a required CI gate; metadata is not an execution proof.
kicad_image = "docker.io/kicad/kicad@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec"
