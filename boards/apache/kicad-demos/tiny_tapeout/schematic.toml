[[sheet.opaque]]
kicad = "(text \"Rule of thumb\\n C1, C2 = 2 * CL - 2 * Cstray\\nUsing a stray cap of 5pF, gives\\nCn = 6pF\\n\\nInto:\\n CL = (C1 * C2) / (C1 + C2) + Cstray\\nThese Cn = 6p give\\nCL = 8pF -- just what we need.\" (exclude_from_sim no) (at 30.48 132.08 0) (effects (font (size 1.27 1.27)) (justify left bottom)) (uuid \"c6023b1c-bb53-4a80-b2bc-b5350c588efc\"))"

