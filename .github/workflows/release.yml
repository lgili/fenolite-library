name: Library release assets
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag; this workflow never creates it
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: library-release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}
  assets:
    needs: checks
    runs-on: ubuntu-24.04
    environment: library-release
    permissions:
      contents: write
    steps:
      - if: vars.LIBRARY_RELEASE_ENABLED != 'true'
        run: |
          echo 'Configure required reviewers for library-release, then explicitly enable LIBRARY_RELEASE_ENABLED.'
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/fenolite
        with: {require: 'library release,library audit,blocks index,blocks test,library check,library seed'}
      - name: Verify existing release and make reproducible assets
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, re, subprocess, tomllib
          from pathlib import Path
          tag = os.environ['TAG']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag): raise SystemExit('Release tag must be vMAJOR.MINOR.PATCH')
          meta = tomllib.loads(Path('library.toml').read_text())
          if tag != 'v' + meta['version']: raise SystemExit('Tag and library.toml version differ')
          published = json.loads(subprocess.check_output(['gh', 'release', 'view', tag, '--json', 'tagName,isDraft'], text=True))
          if published['isDraft'] or published['tagName'] != tag: raise SystemExit('An existing published release is required')
          target = subprocess.check_output(['git', 'rev-parse', tag + '^{commit}'], text=True).strip()
          if target != subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(): raise SystemExit('Checkout differs from release tag')
          for name in ('dist', 'dist-rebuild'):
              args = ['fenolite', 'library', 'release', '.', '--version', meta['version'], '--out', name]
              planned = subprocess.run([*args, '--dry-run', '--json'], capture_output=True, text=True, check=True)
              plan = json.loads(planned.stdout)['result']['plan_id']
              subprocess.run([*args, '--confirm', '--plan', plan, '--json'], check=True)
          first = {path.name: path.read_bytes() for path in Path('dist').iterdir() if path.is_file()}
          second = {path.name: path.read_bytes() for path in Path('dist-rebuild').iterdir() if path.is_file()}
          if first != second: raise SystemExit('Release rebuild differs byte for byte')
          Path('release-metadata.json').write_text(json.dumps({'tag': tag, 'commit': target}, indent=2) + '\n')
          PY
          cd dist
          sha256sum --check SHA256SUMS
      - name: Attach assets to the existing release
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: release-metadata.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist/
