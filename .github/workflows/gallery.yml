name: Library gallery
on:
  workflow_run:
    workflows: [Library release assets]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing library tag vMAJOR.MINOR.PATCH; the job rebuilds its release assets from that tag
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: library-gallery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: tag
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ['MANUAL_TAG'] or json.loads(Path('release-metadata.json').read_text())['tag']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag): raise SystemExit('Invalid release tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write('tag=' + tag + '\n')
          PY
  site:
    needs: release
    runs-on: ubuntu-24.04
    steps:
      # The workflow's own ref gives the tooling (this action, the core pin, licences.toml); the tag gives the items.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}
          path: release-tree
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/fenolite
        with: {require: 'library gallery,library release,build', kicad: 'true'}
      - if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: ${{ runner.temp }}/library-release
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Release assets of the tag (the release run's artefact, or rebuilt twice and compared)
        working-directory: release-tree
        env:
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess, tomllib
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          release = temp / 'library-release'
          tag = os.environ['TAG']
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          if subprocess.check_output(['git', 'rev-parse', tag + '^{commit}'], text=True).strip() != head:
              raise SystemExit('Checkout differs from the tag')
          meta = tomllib.loads(Path('library.toml').read_text())
          if tag != 'v' + meta['version']: raise SystemExit('Tag and library.toml version differ')
          if not (release / 'index.json').is_file():
              builds = []
              for name in ('release-a', 'release-b'):
                  out = temp / name
                  args = ['fenolite', 'library', 'release', '.', '--version', meta['version'], '--out', str(out)]
                  planned = subprocess.run([*args, '--dry-run', '--json'], capture_output=True, text=True)
                  if planned.returncode: raise SystemExit('library release plan failed: ' + planned.stderr)
                  plan = json.loads(planned.stdout)['result']['plan_id']
                  subprocess.run([*args, '--confirm', '--plan', plan, '--json'], check=True, stdout=subprocess.DEVNULL)
                  builds.append({path.name: path.read_bytes() for path in out.iterdir() if path.is_file()})
              if not builds[0] or builds[0] != builds[1]: raise SystemExit('Release rebuild differs byte for byte')
              shutil.copytree(temp / 'release-a', release)
          index = json.loads((release / 'index.json').read_text())
          if index.get('commit') != head: raise SystemExit('Release index commit differs from the checked-out tag')
          if 'v' + index['version'] != tag: raise SystemExit('Release index version differs from the tag')
          PY
          cd "$RUNNER_TEMP/library-release"
          sha256sum --check SHA256SUMS
      - name: Read the latest successful benchmark artefact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          runs = json.loads(subprocess.check_output(['gh', 'run', 'list', '--workflow', 'bench.yml', '--limit', '20', '--json', 'databaseId,status,conclusion'], text=True))
          prior = next((run for run in runs if run['status'] == 'completed' and run['conclusion'] == 'success'), None)
          table = None
          if prior:
              target = Path(os.environ['RUNNER_TEMP']) / 'gallery-benchmark'
              run = subprocess.run(['gh', 'run', 'download', str(prior['databaseId']), '--name', 'library-benchmark', '--dir', str(target)])
              table = next(target.rglob('bench.json'), None) if run.returncode == 0 else None
          if table:
              json.loads(table.read_text())
              shutil.copyfile(table, Path(os.environ['RUNNER_TEMP']) / 'library-release/bench.json')
              print('Benchmark table of bench run', prior['databaseId'])
          else: print('No successful benchmark table is available; the site makes no benchmark claim')
          PY
      - name: Board views and block sheets made fresh from each item, then the attributed gallery
        working-directory: release-tree
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          temp = Path(os.environ['RUNNER_TEMP'])
          release = temp / 'library-release'
          renders = temp / 'gallery-renders'
          renders.mkdir()
          # The layers of fenolite.backends.kicad.plot; the bottom is mirrored, as seen from below.
          SIDES = (('top.svg', 'F.Cu,F.SilkS,F.Fab,Edge.Cuts', []), ('bottom.svg', 'B.Cu,B.SilkS,B.Fab,Edge.Cuts', ['--mirror']))

          def build(design, out):
              """Plan then confirm `fenolite build`; the reason it failed, or None."""
              planned = subprocess.run(['fenolite', 'build', str(design), '--out', str(out), '--dry-run', '--json'], capture_output=True, text=True)
              if planned.returncode: return 'build plan exited ' + str(planned.returncode) + ': ' + planned.stderr.strip()[-400:]
              plan = json.loads(planned.stdout)['result'].get('plan_id')
              done = subprocess.run(['fenolite', 'build', str(design), '--out', str(out), *(['--confirm', '--plan', plan] if plan else ['--confirm']), '--json'], capture_output=True, text=True)
              return 'build exited ' + str(done.returncode) + ': ' + done.stderr.strip()[-400:] if done.returncode else None

          def board(source, folder):
              """Top and bottom views cropped to the board, without the drawing sheet; the reason it failed, or None."""
              with tempfile.TemporaryDirectory(prefix='gallery-') as temporary:
                  out = Path(temporary) / 'build'
                  reason = build(source / 'design.py', out)
                  if reason: return reason
                  boards = sorted(out.glob('*.kicad_pcb'))
                  if len(boards) != 1: return 'the build wrote ' + str(len(boards)) + ' .kicad_pcb files'
                  folder.mkdir(parents=True, exist_ok=True)
                  for name, layers, extra in SIDES:
                      run = subprocess.run(['kicad-cli', 'pcb', 'export', 'svg', '--mode-single', '--layers', layers, *extra,
                                            '--page-size-mode', '2', '--exclude-drawing-sheet', '-o', str(folder / name), str(boards[0])],
                                           capture_output=True, text=True)
                      if run.returncode or not (folder / name).is_file():
                          return 'kicad-cli ' + name + ' exited ' + str(run.returncode) + ': ' + (run.stderr or run.stdout).strip()[-400:]
              return None

          def block(source, folder):
              """The sheet of the block in its usage circuit, which Fenolite draws; the reason it failed, or None."""
              usages = sorted((source / 'usage').glob('*.py'))
              if not usages: return 'the block has no usage circuit'
              with tempfile.TemporaryDirectory(prefix='gallery-') as temporary:
                  out = Path(temporary) / 'build'
                  reason = build(usages[0], out)
                  if reason: return reason
                  sheets = sorted((out / 'sheets').glob('*.kicad_sch')) or sorted(out.glob('*.kicad_sch'))
                  if not sheets: return 'the usage build wrote no schematic'
                  folder.mkdir(parents=True, exist_ok=True)
                  shutil.copyfile(sheets[0], folder / 'schematic.kicad_sch')
              return None

          index = json.loads((release / 'index.json').read_text())
          failures = {}
          for row in index['items']:
              if row['kind'] not in ('board', 'block') or not row.get('gallery'): continue
              root = Path(row['path'])
              if json.loads((root / 'PROVENANCE.json').read_text()).get('trademarks', {}).get('restricted'): continue
              # The item is copied, so a build never writes into the checked-out tag.
              with tempfile.TemporaryDirectory(prefix='gallery-item-') as temporary:
                  source = Path(temporary) / 'item'
                  shutil.copytree(root, source)
                  folder = renders / row['gallery'].rsplit('/', 1)[0]
                  reason = (board if row['kind'] == 'board' else block)(source, folder)
              if reason:
                  failures[row['id']] = reason
                  shutil.rmtree(folder, ignore_errors=True)
              print(row['id'], 'NOT made: ' + reason if reason else 'made')
          (renders / 'failures.json').write_text(json.dumps(failures, indent=2, sort_keys=True) + '\n')
          # These are newly generated review images, never copied upstream pictures; one that cannot be made
          # becomes a placeholder naming why, and never fails the whole site.
          args = ['fenolite', 'library', 'gallery', '.', '--release', str(release), '--out', 'site', '--renders', str(renders)]
          planned = subprocess.run([*args, '--dry-run', '--json'], capture_output=True, text=True)
          if planned.returncode: raise SystemExit('library gallery plan failed: ' + planned.stderr)
          plan = json.loads(planned.stdout)['result']['plan_id']
          done = subprocess.run([*args, '--confirm', '--plan', plan, '--json'], capture_output=True, text=True)
          if done.returncode: raise SystemExit('library gallery failed: ' + done.stderr)
          placeholders = json.loads(done.stdout)['result']['placeholders']
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Placeholders: ' + (', '.join(f"{p['kind']} {p['id']} ({p['reason']})" for p in placeholders) or 'none') + '\n')
          for p in placeholders: print('placeholder:', p['kind'], p['id'], p['reason'])
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: release-tree/site/
  deploy:
    needs: site
    # The github-pages environment accepts deployments from main only; runs on other refs build the site only.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
