name: Library gallery
on:
  workflow_run:
    workflows: [Library release assets]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag whose assets passed the release job
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: library-gallery
  cancel-in-progress: false
jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: release-metadata
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: tag
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import json, os, re
          from pathlib import Path
          tag = os.environ['MANUAL_TAG'] or json.loads(Path('release-metadata.json').read_text())['tag']
          if not re.fullmatch(r'v[0-9]+\.[0-9]+\.[0-9]+', tag): raise SystemExit('Invalid release tag')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out: out.write('tag=' + tag + '\n')
          PY
  pages:
    needs: release
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    steps:
      - if: vars.LIBRARY_PAGES_ENABLED != 'true'
        run: |
          echo 'Configure required reviewers for github-pages, then explicitly enable LIBRARY_PAGES_ENABLED.'
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}
          persist-credentials: false
      - uses: ./.github/actions/fenolite
        with: {require: 'library gallery,library check,render', kicad: 'true'}
      - env:
          TAG: ${{ needs.release.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/library-release"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/library-release"
          cd "$RUNNER_TEMP/library-release"
          sha256sum --check SHA256SUMS
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          index = json.loads(Path('index.json').read_text())
          head = subprocess.check_output(['git', '-C', os.environ['GITHUB_WORKSPACE'], 'rev-parse', 'HEAD'], text=True).strip()
          if index.get('commit') != head: raise SystemExit('Release index commit differs from the checked-out tag')
          if 'v' + index['version'] != os.environ['TAG']: raise SystemExit('Release index version differs from the tag')
          PY
      - name: Read the latest available benchmark artefact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess
          from pathlib import Path
          runs = json.loads(subprocess.check_output(['gh', 'run', 'list', '--workflow', 'bench.yml', '--limit', '20', '--json', 'databaseId,status'], text=True))
          prior = next((run for run in runs if run['status'] == 'completed'), None)
          if prior:
              target = Path(os.environ['RUNNER_TEMP']) / 'gallery-benchmark'
              run = subprocess.run(['gh', 'run', 'download', str(prior['databaseId']), '--name', 'library-benchmark', '--dir', str(target)])
              table = next(target.rglob('bench.json'), None) if run.returncode == 0 else None
              if table:
                  json.loads(table.read_text())
                  shutil.copyfile(table, Path(os.environ['RUNNER_TEMP']) / 'library-release/bench.json')
              else: print('No completed benchmark table is available; the site makes no benchmark claim')
          PY
      - name: Generate attributed gallery and fresh Fenolite board renders
        run: |
          python - <<'PY'
          import json, os, shutil, subprocess, tempfile
          from pathlib import Path
          release = Path(os.environ['RUNNER_TEMP']) / 'library-release'
          args = ['fenolite', 'library', 'gallery', '.', '--release', str(release), '--out', 'site']
          planned = subprocess.run([*args, '--dry-run', '--json'], capture_output=True, text=True, check=True)
          plan = json.loads(planned.stdout)['result']['plan_id']
          subprocess.run([*args, '--confirm', '--plan', plan, '--json'], check=True)
          index = json.loads((release / 'index.json').read_text())
          for row in index['items']:
              if row['kind'] != 'board' or not row.get('gallery'): continue
              root = Path(row['path'])
              provenance = json.loads((root / 'PROVENANCE.json').read_text())
              if provenance.get('trademarks', {}).get('restricted'): continue
              destination = (Path('site') / row['gallery']).parent
              # These are newly generated review images, never copied upstream pictures.
              with tempfile.TemporaryDirectory(prefix='gallery-') as temporary:
                  source = Path(temporary) / 'item'
                  shutil.copytree(root, source)
                  build = Path(temporary) / 'build'
                  subprocess.run(['fenolite', 'build', str(source / 'design.py'), '--out', str(build), '--confirm', '--json'], check=True)
                  subprocess.run(['fenolite', 'render', str(build), '--out', str(destination), '--svg', '--confirm', '--json'], check=True)
              for before, after in (('front.svg', 'top.svg'), ('back.svg', 'bottom.svg')):
                  if not (destination / before).is_file(): raise SystemExit('Render is missing ' + str(destination / before))
                  shutil.copyfile(destination / before, destination / after)
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deployment
        uses: actions/deploy-pages@v4
