# Through-hole pin headers, 2.54 mm pitch, one and two rows, 1 to 40 pins per row, vertical; batch 9 of
# change c0390. Samtec TSW catalogue page (D-0424): 0.64 mm (.025") square post, lead style -07 (post 5.84 mm
# above, tail 2.54 mm below, overall 10.92 mm, so the insulator is 2.54 mm high), insulator 2.48 mm wide for one
# row and 5.02 mm for two, recommended hole 1.02 mm +/- 0.03 mm ([land].drill). The pad ring comes from the land
# table; numbering is the usual odd/even across the rows.
